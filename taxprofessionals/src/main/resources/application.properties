spring.application.name=taxprofessionals

# Include environment properties
spring.config.import=optional:classpath:env.properties

server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
file.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.rra.taxprofessionals=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL:WARN}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
logging.level.org.apache.tomcat=${LOG_LEVEL:INFO}

# File Logging Configuration
logging.file.name=${LOG_FILE_PATH:./logs/taxprofessionals.log}
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - %msg%n

# CORS Configuration - HANDLED BY SecurityConfig.java
# Do not use these properties as they conflict with allowCredentials(true)
# spring.web.cors.allowed-origins=*
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.cors.allowed-headers=*
# spring.web.cors.max-age=3600

# ========== EMAIL CONFIGURATION ==========

app.email.mock.enabled=false
spring.mail.host=${MAIL_HOST:mail.rra.gov.rw}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Configuration
# Tax Professional (Applicant) Frontend
app.frontend.taxprofessional.url=${TAXPROFESSIONAL_FRONTEND_URL:https://tpms.rra.gov.rw}
# Officer/Admin Frontend
app.frontend.officer.url=${OFFICER_FRONTEND_URL:http://10.0.0.65:5000}
app.invitation.token.expiry.days=7
app.password.reset.token.expiry.hours=24

# ========== BOOTSTRAP CONFIGURATION ==========
app.bootstrap.enabled=true
app.bootstrap.admin.employee-id=${BOOTSTRAP_ADMIN_ID}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap.admin.names=${BOOTSTRAP_ADMIN_NAMES}
app.bootstrap.admin.department=${BOOTSTRAP_ADMIN_DEPARTMENT}
# ========== EXTERNAL API CONFIGURATION ==========
# Configuration for connecting to external supplier/tax service
# Note: Auth and Supplier endpoints are on DIFFERENT ports!
external.api.auth-base-url=${EXTERNAL_API_AUTH_BASE_URL:http://192.168.0.117:8560}
external.api.supplier-base-url=${EXTERNAL_API_SUPPLIER_BASE_URL:http://192.168.0.117:8080}
external.api.refresh-token=${EXTERNAL_API_REFRESH_TOKEN:eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJUUExTX1VTRVIiLCJpc3MiOiJodHRwOi8vMTkyLjE2OC4wLjExNzo4NTYwL2FwaS92MS9hdXRoL2xvZ2luIiwiZXhwIjoxNzY3NzcyOTEwfQ.MyXoABmTCk9jaLuPltEtPYqufjpSOdxKM4b33Uqxb6s}
external.api.refresh-endpoint=/api/v1/auth/token/refresh
external.api.supplier-endpoint=/api/v1/tp/suppliers_wsp

# ========== AUTOMATIC REJECTION LETTER CONFIGURATION ==========
# Automatically send rejection letters to first-time rejected applicants after 72 hours
# if they haven't reapplied
app.rejection.letter.auto-send.enabled=${AUTO_REJECTION_LETTER_ENABLED:true}
app.rejection.letter.auto-send.delay-hours=${AUTO_REJECTION_LETTER_DELAY_HOURS:72}
# Cron expression: Run every 6 hours at minute 0
# Format: second minute hour day month weekday
app.rejection.letter.auto-send.schedule-cron=${AUTO_REJECTION_LETTER_CRON:0 0 */6 * * *}
app.rejection.letter.auto-send.max-retries=${AUTO_REJECTION_LETTER_MAX_RETRIES:3}